services:
  - type: web
    name: siri
    runtime: python
    buildCommand: pip install -r requirements.txt && python build_render.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: HF_HUB_OFFLINE
        value: "1"
      - key: ANONYMIZED_TELEMETRY
        value: "False"
      - key: GROQ_API_KEY
        scope: secret
